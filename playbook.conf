<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Valex OS</Name>
    <Username>Valex Team</Username>
    <ShortDescription>Ultimate performance, privacy, and stability playbook for Windows 10 and 11</ShortDescription>
    <Title>Valex OS — Windows Perfected</Title>
    <Description>Valex OS transforms Windows into the fastest, most private, and most stable operating system possible.&#xD;&#xA;&#xD;&#xA;Every telemetry endpoint is severed. Every unnecessary service is eliminated. Every CPU/GPU/timer/network parameter is optimized. Every bloatware package is surgically removed.&#xD;&#xA;&#xD;&#xA;Now fully ISO injection compatible with native AME Wizard YAML actions. Zero external scripts.&#xD;&#xA;&#xD;&#xA;WARNING: This playbook makes deep, irreversible changes. Use only on a fresh Windows installation.</Description>
    <Details>Valex OS 1.0.0 — comprehensive performance and privacy playbook for Windows 10 21H2-22H2 and Windows 11 22H2-25H2. Zero telemetry. AI/Copilot/Recall eliminated. TLS/SMB/cipher/DLL hardened. Vulnerable driver blocklist. 70+ scheduled tasks removed. 40+ AppX packages eliminated. Spectre/Meltdown and VBS/HVCI user-toggleable. ISO injection compatible. All logic uses native AME Wizard YAML actions. Zero external scripts. GPU vendor-aware tuning. AMD/Intel safe preemption. ARM64 cpuArch guards.</Details>
    <Version>1.0.0</Version>
    <UniqueId>f8d4e7b2-3a5c-4f1e-9d6b-8c7a2e5f3d10</UniqueId>
    <SupportedBuilds>
        <string>19044</string>
        <string>19045</string>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26120</string>
        <string>26200</string>
    </SupportedBuilds>
    <PasswordReplace>malte</PasswordReplace>
    <SupportsISO>true</SupportsISO>
    <ISO>
        <DisableBitLocker>true</DisableBitLocker>
        <DisableHardwareRequirements>true</DisableHardwareRequirements>
    </ISO>
    <OOBE>
        <SkipMicrosoftAccount>true</SkipMicrosoftAccount>
        <Internet>Request</Internet>
        <BulletPoints>
            <BulletPoint Icon="Privacy" Title="Privacy"
            Description="All telemetry, data collection, and tracking endpoints are severed. Zero Microsoft callbacks."/>
            <BulletPoint Icon="Rocket" Title="Performance"
            Description="Unnecessary services, scheduled tasks, and bloatware removed. CPU, GPU, memory, and network stack optimized."/>
            <BulletPoint Icon="Lock" Title="Security"
            Description="TLS, SMB, cipher suites, and DLL search order hardened. AI/Copilot/Recall eliminated."/>
        </BulletPoints>
    </OOBE>
    <Overhaul>true</Overhaul>
    <EstimatedMinutes>35</EstimatedMinutes>
    <Requirements>
        <Requirement>Internet</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>DefenderDisabled</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <RadioPage IsRequired="true" DefaultOption="disable-defender" Description="Disable Windows Defender for maximum gaming performance, or keep it enabled for ongoing protection.">
            <TopLine Text="Windows Defender"/>
            <Options>
                <RadioOption>
                    <Text>Disable Defender (Maximum Performance)</Text>
                    <Name>disable-defender</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Keep Defender Enabled</Text>
                    <Name>enable-defender</Name>
                </RadioOption>
            </Options>
            <BottomLine Text="Reduces background CPU usage and improves FPS"/>
        </RadioPage>
        <RadioImagePage IsRequired="true" DefaultOption="browser-firefox" CheckDefaultBrowser="true" Description="Choose your preferred web browser.">
            <TopLine Text="Browser Selection"/>
            <Options>
                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>browser-firefox</Name>
                    <FileName>firefox</FileName>
                    <GradientTopColor>#FF3647</GradientTopColor>
                    <GradientBottomColor>#FFC742</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Brave</Text>
                    <Name>browser-brave</Name>
                    <FileName>brave</FileName>
                    <GradientTopColor>#A33401</GradientTopColor>
                    <GradientBottomColor>#FFC481</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Chrome</Text>
                    <Name>browser-chrome</Name>
                    <FileName>chrome</FileName>
                    <GradientTopColor>#4285F4</GradientTopColor>
                    <GradientBottomColor>#FBBC05</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption None="true"/>
            </Options>
            <BottomLine Text="All browsers are configured for privacy by default"/>
        </RadioImagePage>
        <CheckboxPage IsRequired="true" Description="Core system optimizations. These modifications significantly improve privacy and performance.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Surgical Bloatware Removal (AppX &amp; OneDrive)</Text>
                    <Name>remove-appx</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Absolute Privacy (Disable All Telemetry &amp; Data Collection)</Text>
                    <Name>disable-telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Ultimate Performance Tuning (CPU/GPU/Latency)</Text>
                    <Name>max-performance</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Advanced Network Stack Optimization</Text>
                    <Name>optimize-network</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="User interface and compatibility options.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Streamlined User Interface (Clean Taskbar &amp; Explorer)</Text>
                    <Name>clean-interface</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Apply Valex OS UI (Wallpaper + Lock Screen)</Text>
                    <Name>configure-wallpaper</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Legacy Game Support (DirectPlay + Components)</Text>
                    <Name>enable-directplay</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="System dependencies and essential tools. Installing these ensures maximum compatibility.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install NanaZip (Modern 7-Zip)</Text>
                    <Name>install-nanazip</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install All Visual C++ Runtimes (2005-2022)</Text>
                    <Name>install-vcredist</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install Legacy DirectX Runtimes (June 2010)</Text>
                    <Name>install-directx</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="Advanced performance options. Disable security mitigations for maximum throughput.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Maximize CPU Throughput (Disable Spectre/Meltdown)</Text>
                    <Name>disable-mitigations</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Maximize Gaming Frame-Times (Disable VBS/HVCI)</Text>
                    <Name>disable-vbs</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <RadioPage IsRequired="true" DefaultOption="updates-security" Description="Choose how Windows Updates should be handled.">
            <TopLine Text="Windows Update Policy"/>
            <Options>
                <RadioOption>
                    <Text>Security Updates Only (Recommended)</Text>
                    <Name>updates-security</Name>
                    <Description>Receive only critical security patches. Feature updates are blocked.</Description>
                </RadioOption>
                <RadioOption>
                    <Text>Disable All Updates</Text>
                    <Name>updates-disable</Name>
                    <Description>Completely disable Windows Update. You must update manually when needed.</Description>
                </RadioOption>
                <RadioOption>
                    <Text>Keep Default Update Behavior</Text>
                    <Name>updates-default</Name>
                    <Description>Leave Windows Update as-is. Not recommended for Valex OS.</Description>
                </RadioOption>
            </Options>
        </RadioPage>
    </FeaturePages>
    <Software>
        <Package Option="browser-firefox">
            <Name>firefox</Name>
            <Title>Mozilla Firefox</Title>
            <Icon>firefox</Icon>
            <Description>Privacy-focused web browser configured for optimal performance.</Description>
        </Package>
        <Package Option="browser-brave">
            <Name>brave</Name>
            <Title>Brave Browser</Title>
            <Icon>brave</Icon>
            <Description>Chromium-based browser with built-in ad and tracker blocking.</Description>
        </Package>
        <Package Option="browser-chrome">
            <Name>chrome</Name>
            <Title>Google Chrome</Title>
            <Icon>chrome</Icon>
            <Description>Fast, secure, and free web browser built for the modern web.</Description>
        </Package>
        <Package Option="install-nanazip">
            <Name>nanazip</Name>
            <Title>NanaZip</Title>
            <Icon>nanazip</Icon>
            <Description>The next generation open source file archiver based on 7-Zip.</Description>
        </Package>
        <Package Option="install-vcredist">
            <Name>vcredist</Name>
            <Title>Visual C++ Runtimes</Title>
            <Description>Full Visual C++ runtime stack 2005-2022 for maximum app/game compatibility.</Description>
        </Package>
        <Package Option="install-directx">
            <Name>directx</Name>
            <Title>Legacy DirectX</Title>
            <Description>DirectX June 2010 runtimes for legacy game support.</Description>
        </Package>
    </Software>
    <ProgressText>Severing telemetry, optimizing CPU/GPU/memory/timer, removing bloatware, hardening TLS/SMB/ciphers, cleaning services/interface, installing software.</ProgressText>
    <Git>https://github.com/alimoradmohameddoweb/valex-os-playbook</Git>
    <Website>https://github.com/alimoradmohameddoweb/valex-os-playbook</Website>
</Playbook>
