name: Release

on:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract and validate version
        id: version
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME" -replace '^v'
          $pb = [xml](Get-Content 'playbook.conf' -Raw)
          $version = $pb.Playbook.Version
          Write-Host "Tag version: $tag"
          Write-Host "playbook.conf version: $version"
          if ($tag -ne $version) {
            Write-Error "Tag version ($tag) does not match playbook.conf version ($version)"
            exit 1
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$env:GITHUB_REF_NAME" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version validation: PASSED"

  build:
    name: Build
    runs-on: windows-latest
    needs: validate-tag
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      artifact-path: ${{ steps.build-output.outputs.artifact-path }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build archive
        run: |
          $env:ErrorActionPreference = 'Stop'
          & .\build.ps1
        shell: pwsh

      - name: Locate built artifact
        id: build-output
        shell: pwsh
        run: |
          $apbx = Get-ChildItem -Path '*.apbx' | Select-Object -First 1
          if (-not $apbx) {
            Write-Error "No .apbx file found"
            exit 1
          }
          echo "artifact-path=$($apbx.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          echo "artifact-name=$($apbx.Name)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path '*.apbx' | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -FilePath 'checksums.txt' -Encoding ascii -Append
          }
          Get-Content checksums.txt

      - name: Attach build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: '${{ steps.build-output.outputs.artifact-path }}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-artifacts
          path: |
            *.apbx
            checksums.txt
          retention-days: 1

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build]
    permissions:
      contents: write
      attestations: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-artifacts
          path: release/

      - name: Display structure
        run: ls -la release/

      - name: Generate release notes
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          $version = $env:VERSION
          $content = Get-Content 'CHANGELOG.md' -Raw
          $pattern = "## \[$([regex]::Escape($version))\].*?(?=\n## \[|\Z)"
          $match = [regex]::Match($content, $pattern, 'Singleline')
          if ($match.Success) {
            $section = $match.Value
          } else {
            $section = "Release $version`n`nSee CHANGELOG.md for details.`n"
          }
          $section | Out-File 'release_notes.md'
          Write-Host "Release notes extracted for v$version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: Valex OS v${{ needs.validate-tag.outputs.version }}
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          body_path: release_notes.md
          files: |
            release/*.apbx
            release/checksums.txt
          generate_release_notes: false
          draft: false
          prerelease: false
