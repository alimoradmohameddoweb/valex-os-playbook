name: Feature Request
description: Suggest an enhancement or new feature for Valex OS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Focus on the **problem** you are solving, not just the solution you have in mind.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched existing [issues](https://github.com/alimoradmohameddoweb/valex-os-playbook/issues) and this is not a duplicate
          required: true
        - label: I have checked the [AME Wizard docs](https://docs.amelabs.net) to confirm this is feasible
          required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Features without a clear use case are rarely accepted.
      placeholder: "I am trying to achieve X but currently I have to manually Y after applying the playbook..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work? Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered? Why are they insufficient?
    validations:
      required: false

  - type: dropdown
    id: willing
    attributes:
      label: Would you like to implement this?
      description: Let us know if you plan to submit a pull request
      options:
        - "Yes, I would like to submit a PR"
        - "Maybe, with some guidance"
        - "No, just suggesting"
    validations:
      required: true

  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/alimoradmohameddoweb/valex-os-playbook/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
